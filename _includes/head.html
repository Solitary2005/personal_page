<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != "" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
{% if site.url and site.url != "" %}<link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">{% endif %}
<link rel="icon" href="{{ site.avatar | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
